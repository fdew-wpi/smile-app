{% macro render_field(field) %}
<div class="form-group">
    {{ field.label(class="form-label") }}
    {{ field(class="form-control", **kwargs) }}
    {% if field.errors %}
        {% for error in field.errors %}
            <span class="text-danger">{{ error }}</span>
        {% endfor %}
    {% endif %}
</div>
{% endmacro %}
